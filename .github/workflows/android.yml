name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mkz/app

          cp index.html app/src/main/assets/index.html

          echo 'pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "MKZ"
          include(":app")' > settings.gradle

          echo 'plugins {
            id "com.android.application" version "8.6.1" apply false
          }' > build.gradle

          echo 'plugins {
            id "com.android.application"
          }
          android {
            namespace "com.mkz.app"
            compileSdk 35
            defaultConfig {
              applicationId "com.mkz.app"
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName "1.0"
            }
          }' > app/build.gradle

          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="MKZ">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>' > app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/mkz/app/MainActivity.java <<'EOF'
          package com.mkz.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView web = new WebView(this);
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MKZ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
